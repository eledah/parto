<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESM + RTL — Parto Examples</title>
    <link rel="stylesheet" href="https://unpkg.com/@eledah/parto@0.1.0/dist/parto.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');
      body {
        margin: 0;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        background: #f6f3ec;
        color: #1a2328;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }
      .back {
        font-size: 14px;
        margin-bottom: 16px;
      }
      .back a {
        color: #2e9d61;
        text-decoration: none;
      }
      .back a:hover {
        text-decoration: underline;
      }
      #breadcrumb {
        margin-bottom: 12px;
        font-size: 14px;
        color: #5c6b73;
      }
      #breadcrumb button {
        background: none;
        border: none;
        color: #2e9d61;
        cursor: pointer;
        font: inherit;
        padding: 0 4px;
      }
      #chart {
        height: 560px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        background: #fff;
      }
      .sidebar {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .sidebar button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #d8d2c8;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="back"><a href="../../">← All examples</a></p>
      <h1>نقشه استدلال — نمونه ESM</h1>
      <nav id="breadcrumb" aria-label="مسیر زوم"></nav>
      <div id="chart"></div>
      <div class="sidebar" id="node-buttons"></div>
    </main>
    <script type="importmap">
      {
        "imports": {
          "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
        }
      }
    </script>
    <script type="module">
      import { createArgumentMap } from 'https://unpkg.com/@eledah/parto@0.1.0/dist/index.js';

      const res = await fetch('../../data/persian-map.json');
      const mapData = await res.json();

      const breadcrumb = document.getElementById('breadcrumb');
      const nodeButtons = document.getElementById('node-buttons');

      const chart = createArgumentMap('#chart', mapData, {
        theme: 'light',
        direction: 'rtl',
        lang: 'fa',
        labels: {
          center: 'گزاره اصلی',
          support: 'تأیید',
          attack: 'حمله',
          claim: 'گزاره',
          unknownSpeaker: 'ناشناس',
          intensity: 'شدت',
          confidence: 'اطمینان',
        },
        ariaLabel: 'نقشه استدلال بحث حجاب',
        onZoomChange: (path) => {
          breadcrumb.replaceChildren();
          path.forEach((node, i) => {
            if (i > 0) {
              breadcrumb.append(document.createTextNode(' › '));
            }
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = node.title;
            btn.addEventListener('click', () => {
              chart.zoomToPath(path.slice(0, i + 1).map((p) => p.id));
            });
            breadcrumb.append(btn);
          });
        },
      });

      for (const node of mapData.new_nodes.slice(0, 6)) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = node.title.slice(0, 32) + (node.title.length > 32 ? '…' : '');
        btn.addEventListener('mouseenter', () => chart.highlight(node.id));
        btn.addEventListener('mouseleave', () => chart.highlight(null));
        btn.addEventListener('click', () => chart.zoomTo(node.id));
        nodeButtons.append(btn);
      }
    </script>
  </body>
</html>
