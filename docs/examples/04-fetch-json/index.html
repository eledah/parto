<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch JSON — Parto Examples</title>
    <link rel="stylesheet" href="../../dist/parto.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #182126;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
        text-align: center;
      }
      .back {
        font-size: 14px;
        margin-bottom: 16px;
      }
      .back a {
        color: #285b3d;
        text-decoration: none;
      }
      .back a:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #607078;
        margin: 0 auto 16px;
      }
      #chart {
        height: 520px;
        border: 1px solid #e1e6e8;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 36px rgba(24, 33, 38, 0.07);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="back"><a href="../../">← All examples</a></p>
      <h1>Load map from JSON</h1>
      <p>Map data is fetched from <code>data/sample-map.json</code> with loading and error overlays.</p>
      <div id="chart"></div>
    </main>
    <script src="../../dist/parto.global.min.js"></script>
    <script>
      const chart = Parto.createArgumentMap('#chart', null, {
        theme: 'auto',
        ariaLabel: 'Argument map loaded from JSON',
      });

      chart.setLoading(true);

      fetch('../../data/sample-map.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load map (${response.status})`);
          }
          return response.json();
        })
        .then((mapData) => {
          chart.setLoading(false);
          chart.setData(mapData);
        })
        .catch((err) => {
          chart.setLoading(false);
          chart.showError(err.message || 'Could not load map data.');
        });
    </script>
  </body>
</html>
