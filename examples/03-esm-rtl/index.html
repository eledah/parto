<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نقشه استدلال — ESM و RTL</title>
    <link rel="stylesheet" href="../../dist/parto.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');
      :root {
        --center: #755916;
        --support: #285b3d;
        --attack: #7f3737;
        --border: #e1e6e8;
        --muted: #607078;
      }
      body {
        margin: 0;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        background: #fff;
        color: #182126;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
        text-align: center;
      }
      #breadcrumb {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        min-height: 28px;
        margin: 0 auto 14px;
        font-size: 14px;
        color: var(--muted);
      }
      #breadcrumb button {
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 2px 4px;
      }
      #breadcrumb button[data-relation='center'] {
        color: var(--center);
      }
      #breadcrumb button[data-relation='support'] {
        color: var(--support);
      }
      #breadcrumb button[data-relation='attack'] {
        color: var(--attack);
      }
      #breadcrumb button[aria-current='page'] {
        font-weight: 750;
      }
      .breadcrumb__separator {
        color: #9aa5aa;
        font-weight: 600;
      }
      #chart {
        height: 560px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 36px rgba(24, 33, 38, 0.07);
      }
      .sidebar {
        margin-top: 16px;
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .sidebar button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        color: #324149;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>نقشه استدلال — نمونه ESM</h1>
      <nav id="breadcrumb" aria-label="مسیر زوم"></nav>
      <div id="chart"></div>
      <div class="sidebar" id="node-buttons"></div>
    </main>
    <script type="importmap">
      {
        "imports": {
          "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
        }
      }
    </script>
    <script type="module">
      import { createArgumentMap } from '../../dist/index.js';

      const res = await fetch('../data/persian-map.json');
      const mapData = await res.json();

      const breadcrumb = document.getElementById('breadcrumb');
      const nodeButtons = document.getElementById('node-buttons');

      const chart = createArgumentMap('#chart', mapData, {
        theme: 'light',
        direction: 'rtl',
        lang: 'fa',
        labels: {
          legend: 'راهنمای رنگ‌ها',
          center: 'گزاره اصلی',
          support: 'تأیید',
          attack: 'حمله',
          claim: 'گزاره',
          unknownSpeaker: 'ناشناس',
          intensity: 'شدت',
          confidence: 'اطمینان',
        },
        ariaLabel: 'نقشه استدلال بحث حجاب',
        onZoomChange: (path) => {
          breadcrumb.replaceChildren();
          path.forEach((node, i) => {
            if (i > 0) {
              const sep = document.createElement('span');
              sep.className = 'breadcrumb__separator';
              sep.textContent = '‹';
              breadcrumb.append(sep);
            }
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = node.title;
            btn.dataset.relation = node.relationType ?? 'center';
            if (i === path.length - 1) {
              btn.setAttribute('aria-current', 'page');
            }
            btn.addEventListener('click', () => {
              chart.zoomToPath(path.slice(0, i + 1).map((p) => p.id));
            });
            breadcrumb.append(btn);
          });
        },
      });

      for (const node of mapData.new_nodes.slice(0, 6)) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = node.title.slice(0, 32) + (node.title.length > 32 ? '…' : '');
        btn.addEventListener('mouseenter', () => chart.highlight(node.id));
        btn.addEventListener('mouseleave', () => chart.highlight(null));
        btn.addEventListener('click', () => chart.zoomTo(node.id));
        nodeButtons.append(btn);
      }
    </script>
  </body>
</html>
