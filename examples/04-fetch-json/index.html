<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argument Map — Fetch JSON</title>
    <link rel="stylesheet" href="../../dist/parto.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f6f3ec;
        color: #1a2328;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #5c6b73;
        margin-bottom: 16px;
      }
      #chart {
        height: 520px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Argument Map — load from JSON</h1>
      <p>Map data is fetched from <code>examples/data/sample-map.json</code>.</p>
      <div id="chart"></div>
    </main>
    <script src="../../dist/parto.global.min.js"></script>
    <script>
      const chart = Parto.createArgumentMap('#chart', null, {
        theme: 'auto',
        ariaLabel: 'Argument map loaded from JSON',
      });

      chart.setLoading(true);

      fetch('../data/sample-map.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load map (${response.status})`);
          }
          return response.json();
        })
        .then((mapData) => {
          chart.setLoading(false);
          chart.setData(mapData);
        })
        .catch((err) => {
          chart.setLoading(false);
          chart.showError(err.message || 'Could not load map data.');
        });
    </script>
  </body>
</html>
