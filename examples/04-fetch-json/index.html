<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argument Map — Fetch JSON</title>
    <link rel="stylesheet" href="../../dist/parto-argument-map.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f6f3ec;
        color: #1a2328;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #5c6b73;
        margin-bottom: 16px;
      }
      #chart {
        height: 520px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        background: #fff;
      }
      #status {
        font-size: 14px;
        color: #5c6b73;
        margin-bottom: 12px;
      }
      #status.is-error {
        color: #d64545;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Argument Map — load from JSON</h1>
      <p>Map data is fetched from <code>examples/data/sample-map.json</code>.</p>
      <p id="status">Loading map…</p>
      <div id="chart"></div>
    </main>
    <script src="../../dist/parto-argument-map.global.min.js"></script>
    <script>
      const status = document.getElementById('status');
      const chartEl = document.getElementById('chart');

      async function loadMap(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to load map (${response.status})`);
        }
        return response.json();
      }

      loadMap('../data/sample-map.json')
        .then((mapData) => {
          status.textContent = 'Map loaded.';
          PartoArgumentMap.createArgumentMap(chartEl, mapData, {
            theme: 'auto',
            ariaLabel: 'Argument map loaded from JSON',
          });
        })
        .catch((err) => {
          status.textContent = err.message || 'Could not load map data.';
          status.classList.add('is-error');
          chartEl.innerHTML =
            '<p style="padding:24px;color:#5c6b73">Serve this folder with a static server (file:// blocks fetch).</p>';
        });
    </script>
  </body>
</html>
